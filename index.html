<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anson Practice Piano — Interactive Piano Practice</title>
    <meta name="description" content="Anson Practice Piano: interactive piano practice studio featuring live sheet music cursor, Wait Mode, Tempo Mode, real-time scoring, Web MIDI, and Virtual Keyboard." />
    <meta property="og:title" content="Anson Practice Piano — Interactive Piano Practice" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('anson_piano_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B1120] text-[#0F172A] dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
